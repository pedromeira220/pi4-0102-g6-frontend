server {
    listen 80;
    root /usr/share/nginx/html;

    # Rotas do React Router (/order/42, /demo) caem no index.html
    location / {
        try_files $uri /index.html;
    }

    # Backend 1 (CT1 consultarPedido, CT3 reiniciarDemo). A página chama /api/pedidos/42 e o
    # Backend 1 recebe /pedidos/42. Passar pela mesma origem da página é o que faz o celular
    # aberto pelo QR funcionar sem conhecer o endereço dos backends.
    location /api/ {
        proxy_pass http://backend1:8080/;
        proxy_set_header Host $http_host;
    }

    # Backend 2 (CT5 acompanharPedido): WebSocket em /ws
    location /ws {
        proxy_pass http://backend2:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
}
